version: '3.8'

services:
  # Streamlit Web Application
  ui:
    build: .
    container_name: traffic-violation-ui
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    restart: unless-stopped
    command: ["streamlit", "run", "app/main.py", "--server.port=8501", "--server.address=0.0.0.0"]

  # Optional FastAPI REST API
  api:
    build: .
    container_name: traffic-violation-api
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    command: ["uvicorn", "backend.server:app", "--host", "0.0.0.0", "--port", "8000"]
